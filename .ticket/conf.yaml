# To keep it consistant and not to add more dependencies the config is written in yaml.
---
# the prefix of a ticket tk-12345 this *-> tk <-*
ticket_prefix: 'tk'
# the prefix of an initative in-12345 this *-> in <-*
initiative_prefix: 'in'
# The number of random hex chars to use as the object name. 3 would give you things like this in-001 tk-001 and 5 would give you in-00001 tk-00001
length: 5
